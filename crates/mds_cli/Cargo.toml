[package]
name = "mds_cli"
version = "0.1.2"
edition = "2021"

[[bin]]
name = "mdsr-cli"
path = "src/main.rs"

[dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dialoguer = "0.11"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.11.27", features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mds_domain = { path = "../mds_domain" }
mds_infra = { path = "../mds_infra" }
mds_app = { path = "../mds_app" }
