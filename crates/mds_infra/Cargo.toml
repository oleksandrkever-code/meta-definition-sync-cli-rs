[package]
name = "mds_infra"
version = "0.1.0"
edition = "2021"

[dependencies]
mds_app = { path = "../mds_app" }
mds_domain = { path = "../mds_domain" }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# Pin reqwest to 0.11.x for compatibility with the pinned toolchain in rust-toolchain.toml
reqwest = { version = "0.11.27", features = ["blocking", "json", "rustls-tls"] }